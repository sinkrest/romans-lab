<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask My Portfolio — Jarvi</title>
  <meta name="description" content="Ask Jarvi anything about Roman Martins' work — skills, projects, case studies. Cited answers from a curated knowledge base. Powered by Claude.">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #080810;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .55rem 1rem;
      background: rgba(11,22,40,0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .bar a {
      padding: .3rem .75rem;
      border-radius: 7px;
      border: 1px solid transparent;
      color: #8a9dba;
      font-size: .78rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: .02em;
      white-space: nowrap;
      transition: color .18s, border-color .18s, background .18s;
    }
    .bar a:hover {
      color: #6366f1;
      border-color: rgba(99,102,241,0.3);
      background: rgba(99,102,241,0.08);
    }
    .bar .crumb {
      font-size: .78rem;
      font-weight: 600;
      color: #6366f1;
      letter-spacing: .04em;
    }
    .bar .sep {
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,0.12);
    }
    iframe {
      display: block;
      width: 100%;
      flex: 1;
      border: 0;
      background: #080810;
    }
  </style>
</head>
<body>
  <nav class="bar">
    <a href="../" title="Open Roman's Lab">⚗️ Roman's Lab</a>
    <span class="sep"></span>
    <span class="crumb">💬 Ask My Portfolio</span>
  </nav>
  <iframe src="https://ask-portfolio-liard.vercel.app" title="Ask My Portfolio — Jarvi" allow="clipboard-write"></iframe>
</body>
</html>
