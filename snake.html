<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake '99 — Roman's Lab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Silkscreen', monospace;
            background: #1a1a2e;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(67,82,58,0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(26,26,46,1) 0%, #0f0f1a 100%);
            color: #c8d8c0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .phone {
            position: relative;
            background: linear-gradient(180deg, #2a2d3a 0%, #1e2028 40%, #2a2d3a 100%);
            border-radius: 32px 32px 42px 42px;
            padding: 18px 20px 24px;
            box-shadow:
                0 0 0 2px #3a3d4a,
                0 0 0 4px #1a1a2e,
                0 8px 32px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.05);
            max-width: 380px;
            width: 100%;
        }

        .brand {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #4a4d5a;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-family: 'Silkscreen', monospace;
        }

        .screen-bezel {
            background: linear-gradient(180deg, #3a3d48 0%, #2a2d35 100%);
            border-radius: 8px;
            padding: 10px 12px 8px;
            margin-bottom: 14px;
            box-shadow:
                inset 0 2px 4px rgba(0,0,0,0.4),
                0 1px 0 rgba(255,255,255,0.03);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 6px;
            font-size: 9px;
            color: #2d4a1e;
            font-family: 'Silkscreen', monospace;
        }
        .signal-bars { display: flex; gap: 1px; align-items: flex-end; }
        .signal-bar { width: 3px; background: #2d4a1e; }

        .lcd {
            position: relative;
            background: #9bbc0f;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
        }

        .lcd::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px),
                repeating-linear-gradient(90deg, transparent, transparent 1px, rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px);
            pointer-events: none;
            z-index: 2;
        }

        .lcd::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(155,188,15,0.3) 0%, transparent 60%);
            pointer-events: none;
            z-index: 3;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px 0;
            font-size: 9px;
            color: #2d4a1e;
            font-family: 'Silkscreen', monospace;
        }

        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
        }

        .dpad {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .dpad-btn {
            position: absolute;
            background: linear-gradient(180deg, #3a3d4a 0%, #2a2d35 100%);
            border: 1px solid #4a4d5a;
            color: #6a6d7a;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.08s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .dpad-btn:active {
            background: linear-gradient(180deg, #2a2d35 0%, #1e2028 100%);
            transform: scale(0.95);
        }

        .dpad-up { top: 0; left: 35px; width: 50px; height: 42px; border-radius: 8px 8px 2px 2px; }
        .dpad-down { bottom: 0; left: 35px; width: 50px; height: 42px; border-radius: 2px 2px 8px 8px; }
        .dpad-left { top: 35px; left: 0; width: 42px; height: 50px; border-radius: 8px 2px 2px 8px; }
        .dpad-right { top: 35px; right: 0; width: 42px; height: 50px; border-radius: 2px 8px 8px 2px; }
        .dpad-center { top: 35px; left: 35px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(180deg, #2a2d35 0%, #222430 100%); border-color: #3a3d4a; }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .action-row {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(180deg, #3a3d4a 0%, #2a2d35 100%);
            border: 1px solid #4a4d5a;
            color: #5a5d6a;
            font-size: 8px;
            font-family: 'Silkscreen', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.08s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .action-btn:active {
            background: linear-gradient(180deg, #2a2d35 0%, #1e2028 100%);
            transform: scale(0.93);
        }

        .action-btn.green { border-color: #2d6a1e; color: #3a8a2a; }
        .action-btn.red { border-color: #6a1e1e; color: #8a3a3a; }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 10px 24px 4px;
        }

        .key {
            background: linear-gradient(180deg, #3a3d4a 0%, #2a2d35 100%);
            border: 1px solid #4a4d5a;
            border-radius: 6px;
            padding: 7px 4px 5px;
            text-align: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: all 0.08s;
        }

        .key:active {
            background: linear-gradient(180deg, #2a2d35 0%, #1e2028 100%);
            transform: scale(0.96);
        }

        .key-num {
            font-size: 13px;
            font-weight: 700;
            color: #8a8d9a;
            font-family: 'Silkscreen', monospace;
            line-height: 1;
        }

        .key-letters {
            font-size: 6px;
            color: #4a4d5a;
            font-family: 'Silkscreen', monospace;
            margin-top: 2px;
            letter-spacing: 0.1em;
        }

        .phone-bottom {
            display: flex;
            justify-content: center;
            padding: 8px 0 2px;
        }

        .mic-hole {
            width: 4px; height: 4px;
            background: #1a1a2e;
            border-radius: 50%;
            margin: 0 3px;
        }

        .game-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 4;
            background: #9bbc0f;
        }

        .game-overlay.hidden { display: none; }

        .pixel-text {
            font-family: 'Press Start 2P', monospace;
            color: #306230;
            text-align: center;
        }

        .pixel-text-lg { font-size: 14px; line-height: 1.8; }
        .pixel-text-md { font-size: 10px; line-height: 1.8; }
        .pixel-text-sm { font-size: 7px; line-height: 2; color: #4a7a3a; }

        .blink { animation: blinkAnim 1s step-end infinite; }
        @keyframes blinkAnim { 50% { opacity: 0; } }

        .intro-snake {
            margin: 12px 0;
            display: flex;
            gap: 2px;
            justify-content: center;
        }

        .intro-block {
            width: 10px;
            height: 10px;
            background: #306230;
            animation: introSlide 2s ease-in-out infinite;
        }

        .intro-block:nth-child(2) { animation-delay: 0.1s; }
        .intro-block:nth-child(3) { animation-delay: 0.2s; }
        .intro-block:nth-child(4) { animation-delay: 0.3s; }
        .intro-block:nth-child(5) { animation-delay: 0.4s; }

        @keyframes introSlide {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .hi-scores {
            margin-top: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #4a7a3a;
            line-height: 2.2;
            text-align: left;
        }

        .level-dots {
            display: flex;
            gap: 3px;
            justify-content: center;
            margin-top: 4px;
        }

        .level-dot {
            width: 6px; height: 6px;
            border: 1px solid #306230;
        }

        .level-dot.filled { background: #306230; }

        .desktop-hint {
            margin-top: 16px;
            font-size: 9px;
            color: #3a3d4a;
            text-align: center;
            font-family: 'Silkscreen', monospace;
        }

        .desktop-hint kbd {
            background: #2a2d3a;
            border: 1px solid #3a3d4a;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 8px;
        }

        @media (max-height: 700px) {
            .keypad { padding: 6px 24px 2px; gap: 4px; }
            .key { padding: 5px 4px 3px; }
            .dpad { width: 100px; height: 100px; }
            .dpad-up { left: 30px; width: 40px; height: 34px; }
            .dpad-down { left: 30px; width: 40px; height: 34px; }
            .dpad-left { top: 30px; width: 34px; height: 40px; }
            .dpad-right { top: 30px; width: 34px; height: 40px; }
            .dpad-center { top: 30px; left: 30px; width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

<div class="phone">
    <div class="brand">ROMAN'S LAB</div>

    <div class="screen-bezel">
        <div class="status-bar">
            <div class="signal-bars">
                <div class="signal-bar" style="height:4px"></div>
                <div class="signal-bar" style="height:7px"></div>
                <div class="signal-bar" style="height:10px"></div>
                <div class="signal-bar" style="height:13px"></div>
            </div>
            <span id="status-text">Snake '99</span>
            <span id="battery">&#x1F50B;</span>
        </div>

        <div class="lcd">
            <canvas id="canvas" width="320" height="288"></canvas>

            <div class="game-overlay" id="overlay-start">
                <div class="pixel-text pixel-text-lg">SNAKE</div>
                <div class="pixel-text pixel-text-sm">'99</div>
                <div class="intro-snake">
                    <div class="intro-block"></div>
                    <div class="intro-block"></div>
                    <div class="intro-block"></div>
                    <div class="intro-block"></div>
                    <div class="intro-block"></div>
                </div>
                <div class="pixel-text pixel-text-sm">- select level -</div>
                <div class="level-dots" id="level-dots">
                    <div class="level-dot filled"></div>
                    <div class="level-dot"></div>
                    <div class="level-dot"></div>
                    <div class="level-dot"></div>
                    <div class="level-dot"></div>
                </div>
                <div class="pixel-text pixel-text-sm" style="margin-top:8px">
                    <span class="blink">PRESS START</span>
                </div>
                <div class="hi-scores" id="hi-scores">
                    TOP: <span id="hi-top">000</span>
                </div>
            </div>

            <div class="game-overlay hidden" id="overlay-gameover">
                <div class="pixel-text pixel-text-md">GAME OVER</div>
                <div class="pixel-text pixel-text-sm" style="margin-top:8px">
                    SCORE: <span id="go-score">0</span>
                </div>
                <div class="pixel-text pixel-text-sm">
                    APPLES: <span id="go-apples">0</span>
                </div>
                <div class="pixel-text pixel-text-sm">
                    LENGTH: <span id="go-length">3</span>
                </div>
                <div class="pixel-text pixel-text-sm" id="go-hiscore" style="margin-top:4px;display:none">
                    !! NEW RECORD !!
                </div>
                <div class="pixel-text pixel-text-sm" style="margin-top:12px">
                    <span class="blink">PRESS START</span>
                </div>
            </div>

            <div class="game-overlay hidden" id="overlay-pause">
                <div class="pixel-text pixel-text-md">PAUSED</div>
                <div class="pixel-text pixel-text-sm" style="margin-top:8px">
                    <span class="blink">PRESS START</span>
                </div>
            </div>
        </div>

        <div class="score-bar">
            <span>Score: <strong id="score-display">000</strong></span>
            <span>Lvl: <strong id="level-display">1</strong></span>
            <span>Hi: <strong id="hi-display">000</strong></span>
        </div>
    </div>

    <div class="controls-area">
        <div class="dpad">
            <button class="dpad-btn dpad-up" id="btn-up" aria-label="Up">&#9650;</button>
            <button class="dpad-btn dpad-down" id="btn-down" aria-label="Down">&#9660;</button>
            <button class="dpad-btn dpad-left" id="btn-left" aria-label="Left">&#9664;</button>
            <button class="dpad-btn dpad-right" id="btn-right" aria-label="Right">&#9654;</button>
            <button class="dpad-btn dpad-center" id="btn-center" aria-label="Start"></button>
        </div>
        <div class="action-buttons">
            <div class="action-row">
                <button class="action-btn green" id="btn-start" aria-label="Start Game">GO</button>
                <button class="action-btn red" id="btn-pause" aria-label="Pause">| |</button>
            </div>
        </div>
    </div>

    <div class="keypad">
        <div class="key" data-level="1"><div class="key-num">1</div><div class="key-letters"></div></div>
        <div class="key" data-level="2"><div class="key-num">2</div><div class="key-letters">ABC</div></div>
        <div class="key" data-level="3"><div class="key-num">3</div><div class="key-letters">DEF</div></div>
        <div class="key" data-level="4"><div class="key-num">4</div><div class="key-letters">GHI</div></div>
        <div class="key" data-level="5"><div class="key-num">5</div><div class="key-letters">JKL</div></div>
        <div class="key"><div class="key-num">6</div><div class="key-letters">MNO</div></div>
        <div class="key"><div class="key-num">7</div><div class="key-letters">PQRS</div></div>
        <div class="key"><div class="key-num">8</div><div class="key-letters">TUV</div></div>
        <div class="key"><div class="key-num">9</div><div class="key-letters">WXYZ</div></div>
        <div class="key"><div class="key-num">*</div><div class="key-letters"></div></div>
        <div class="key"><div class="key-num">0</div><div class="key-letters">+</div></div>
        <div class="key"><div class="key-num">#</div><div class="key-letters"></div></div>
    </div>

    <div class="phone-bottom">
        <div class="mic-hole"></div>
        <div class="mic-hole"></div>
        <div class="mic-hole"></div>
        <div class="mic-hole"></div>
        <div class="mic-hole"></div>
    </div>
</div>

<div class="desktop-hint">
    <kbd>&#8592;</kbd> <kbd>&#8593;</kbd> <kbd>&#8594;</kbd> <kbd>&#8595;</kbd> move &nbsp;&middot;&nbsp;
    <kbd>Enter</kbd> start &nbsp;&middot;&nbsp;
    <kbd>P</kbd> pause &nbsp;&middot;&nbsp;
    <kbd>1</kbd>-<kbd>5</kbd> level
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const LCD_BG    = '#9bbc0f';
const LCD_LIGHT = '#8bac0f';
const LCD_MED   = '#306230';
const LCD_DARK  = '#0f380f';

const CELL = 16;
const COLS = 20;
const ROWS = 18;

const SPEEDS = [160, 130, 100, 75, 55];

let snake, dir, nextDir, apple, score, applesEaten, hiScore, level, running, paused, gameLoop;
let walls = [];

hiScore = parseInt(localStorage.getItem('snake99_hi') || '0');
level = parseInt(localStorage.getItem('snake99_level') || '1');
if (level < 1 || level > 5) level = 1;

updateHiDisplay();
updateLevelDots();

let audioCtx;
function beep(freq, dur, vol) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.08;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.06));
    osc.stop(audioCtx.currentTime + (dur || 0.06));
}

function sfxEat()   { beep(880, 0.05, 0.06); setTimeout(() => beep(1100, 0.05, 0.05), 50); }
function sfxDie()   { beep(220, 0.15, 0.08); setTimeout(() => beep(140, 0.2, 0.06), 150); }
function sfxStart() { beep(440, 0.04, 0.05); setTimeout(() => beep(660, 0.04, 0.05), 60); setTimeout(() => beep(880, 0.06, 0.05), 120); }

function startGame() {
    document.getElementById('overlay-start').classList.add('hidden');
    document.getElementById('overlay-gameover').classList.add('hidden');
    document.getElementById('overlay-pause').classList.add('hidden');

    snake = [{ x: 10, y: 9 }, { x: 9, y: 9 }, { x: 8, y: 9 }];
    dir = 'right';
    nextDir = 'right';
    score = 0;
    applesEaten = 0;
    running = true;
    paused = false;

    walls = [];
    if (level >= 3) {
        for (let x = 6; x <= 13; x++) walls.push({ x, y: 5 });
        for (let x = 6; x <= 13; x++) walls.push({ x, y: 12 });
    }
    if (level >= 4) {
        for (let y = 3; y <= 8; y++) walls.push({ x: 3, y });
        for (let y = 9; y <= 14; y++) walls.push({ x: 16, y });
    }
    if (level >= 5) {
        for (let x = 1; x <= 4; x++) walls.push({ x, y: 1 });
        for (let x = 15; x <= 18; x++) walls.push({ x, y: 16 });
        for (let y = 1; y <= 4; y++) walls.push({ x: 1, y });
        for (let y = 13; y <= 16; y++) walls.push({ x: 18, y });
    }

    spawnApple();
    updateScoreDisplay();
    sfxStart();

    clearInterval(gameLoop);
    gameLoop = setInterval(tick, SPEEDS[level - 1]);
}

function spawnApple() {
    let pos;
    do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (
        snake.some(s => s.x === pos.x && s.y === pos.y) ||
        walls.some(w => w.x === pos.x && w.y === pos.y)
    );
    apple = pos;
}

function tick() {
    if (!running || paused) return;

    dir = nextDir;
    const head = { ...snake[0] };
    const delta = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] }[dir];
    head.x += delta[0];
    head.y += delta[1];

    if (level <= 2) {
        if (head.x < 0) head.x = COLS - 1;
        if (head.x >= COLS) head.x = 0;
        if (head.y < 0) head.y = ROWS - 1;
        if (head.y >= ROWS) head.y = 0;
    } else {
        if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
    }

    if (walls.some(w => w.x === head.x && w.y === head.y)) return die();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return die();

    snake.unshift(head);

    if (head.x === apple.x && head.y === apple.y) {
        applesEaten++;
        score += 10 * level;
        sfxEat();
        spawnApple();
        updateScoreDisplay();

        if (applesEaten % 5 === 0) {
            clearInterval(gameLoop);
            const boost = Math.max(SPEEDS[level - 1] * 0.85, 40);
            gameLoop = setInterval(tick, boost);
        }
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.fillStyle = LCD_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = LCD_LIGHT;
    for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
            ctx.fillRect(x * CELL, y * CELL, 1, 1);
        }
    }

    if (level >= 3) {
        ctx.fillStyle = LCD_DARK;
        for (let x = 0; x < COLS; x++) {
            drawBlock(x, 0, LCD_DARK, 0.3);
            drawBlock(x, ROWS - 1, LCD_DARK, 0.3);
        }
        for (let y = 0; y < ROWS; y++) {
            drawBlock(0, y, LCD_DARK, 0.3);
            drawBlock(COLS - 1, y, LCD_DARK, 0.3);
        }
    }

    walls.forEach(w => drawBlock(w.x, w.y, LCD_DARK, 1));

    const pulse = Math.sin(Date.now() / 200) * 0.15 + 0.85;
    drawApple(apple.x, apple.y, pulse);

    for (let i = snake.length - 1; i >= 0; i--) {
        if (i === 0) drawSnakeHead(snake[i].x, snake[i].y);
        else drawBlock(snake[i].x, snake[i].y, LCD_DARK, 1);
    }
}

function drawBlock(x, y, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    ctx.globalAlpha = 1;
}

function drawSnakeHead(x, y) {
    ctx.fillStyle = LCD_DARK;
    ctx.fillRect(x * CELL, y * CELL, CELL, CELL);

    ctx.fillStyle = LCD_BG;
    const cx = x * CELL + CELL / 2;
    const cy = y * CELL + CELL / 2;

    const eyeMap = {
        up:    [[-3, -2], [3, -2]],
        down:  [[-3,  2], [3,  2]],
        left:  [[-3, -3], [-3, 3]],
        right: [[ 3, -3], [ 3, 3]],
    };

    (eyeMap[dir] || eyeMap.right).forEach(([ex, ey]) => {
        ctx.fillRect(cx + ex - 1, cy + ey - 1, 2, 2);
    });
}

function drawApple(x, y, pulse) {
    ctx.fillStyle = LCD_DARK;
    ctx.globalAlpha = pulse;
    const bx = x * CELL + 2;
    const by = y * CELL + 2;
    const bs = CELL - 4;

    ctx.fillRect(bx + 2, by, bs - 4, bs);
    ctx.fillRect(bx, by + 2, bs, bs - 4);
    ctx.fillRect(bx + 1, by + 1, bs - 2, bs - 2);
    ctx.fillRect(bx + bs/2 - 1, by - 2, 2, 3);
    ctx.fillRect(bx + bs/2 + 1, by - 1, 3, 2);

    ctx.fillStyle = LCD_BG;
    ctx.fillRect(bx + 3, by + 3, 2, 2);
    ctx.globalAlpha = 1;
}

function die() {
    running = false;
    clearInterval(gameLoop);
    sfxDie();

    let flashes = 0;
    const flashInterval = setInterval(() => {
        ctx.fillStyle = flashes % 2 === 0 ? LCD_DARK : LCD_BG;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashes++;
        if (flashes >= 6) {
            clearInterval(flashInterval);
            showGameOver();
        }
    }, 100);
}

function showGameOver() {
    const isNew = score > hiScore;
    if (isNew) {
        hiScore = score;
        localStorage.setItem('snake99_hi', hiScore.toString());
        updateHiDisplay();
    }

    document.getElementById('go-score').textContent = score;
    document.getElementById('go-apples').textContent = applesEaten;
    document.getElementById('go-length').textContent = snake.length;
    document.getElementById('go-hiscore').style.display = isNew ? 'block' : 'none';
    document.getElementById('overlay-gameover').classList.remove('hidden');
}

function togglePause() {
    if (!running) return;
    paused = !paused;
    document.getElementById('overlay-pause').classList.toggle('hidden', !paused);
    document.getElementById('status-text').textContent = paused ? 'PAUSED' : "Snake '99";
}

function updateScoreDisplay() {
    document.getElementById('score-display').textContent = String(score).padStart(3, '0');
}

function updateHiDisplay() {
    document.getElementById('hi-display').textContent = String(hiScore).padStart(3, '0');
    document.getElementById('hi-top').textContent = String(hiScore).padStart(3, '0');
}

function setLevel(l) {
    level = Math.max(1, Math.min(5, l));
    localStorage.setItem('snake99_level', level.toString());
    document.getElementById('level-display').textContent = level;
    updateLevelDots();
    beep(300 + level * 100, 0.04, 0.04);
}

function updateLevelDots() {
    document.querySelectorAll('#level-dots .level-dot').forEach((dot, i) => {
        dot.classList.toggle('filled', i < level);
    });
    document.getElementById('level-display').textContent = level;
}

function changeDir(newDir) {
    const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
    if (opposites[newDir] !== dir) nextDir = newDir;
}

document.addEventListener('keydown', e => {
    const dirMap = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        w: 'up', s: 'down', a: 'left', d: 'right',
        W: 'up', S: 'down', A: 'left', D: 'right',
    };

    if (dirMap[e.key]) {
        e.preventDefault();
        changeDir(dirMap[e.key]);
    }

    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!running || paused) {
            if (paused) togglePause();
            else startGame();
        }
    }

    if (e.key === 'p' || e.key === 'P') togglePause();

    if (!running && !paused) {
        const num = parseInt(e.key);
        if (num >= 1 && num <= 5) setLevel(num);
    }
});

document.getElementById('btn-up').addEventListener('click', () => changeDir('up'));
document.getElementById('btn-down').addEventListener('click', () => changeDir('down'));
document.getElementById('btn-left').addEventListener('click', () => changeDir('left'));
document.getElementById('btn-right').addEventListener('click', () => changeDir('right'));
document.getElementById('btn-center').addEventListener('click', () => {
    if (!running) startGame();
    else togglePause();
});
document.getElementById('btn-start').addEventListener('click', () => {
    if (!running) startGame();
    else togglePause();
});
document.getElementById('btn-pause').addEventListener('click', togglePause);

document.querySelectorAll('.key[data-level]').forEach(key => {
    key.addEventListener('click', () => {
        if (!running && !paused) setLevel(parseInt(key.dataset.level));
    });
});

let touchStart = null;
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
        if (!running) startGame();
        else togglePause();
    } else if (Math.abs(dx) > Math.abs(dy)) {
        changeDir(dx > 0 ? 'right' : 'left');
    } else {
        changeDir(dy > 0 ? 'down' : 'up');
    }
    touchStart = null;
});

ctx.fillStyle = LCD_BG;
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
