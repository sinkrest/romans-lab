<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Publish or Perish — Roman's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #05050f;
  font-family: 'Inter', sans-serif;
  color: #e4eaf4;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}

.game-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 1rem;
}

canvas {
  display: block;
  border-radius: 14px;
}

.dpad {
  display: none;
  grid-template-columns: repeat(3, 56px);
  grid-template-rows: repeat(3, 56px);
  gap: 5px;
}

@media (pointer: coarse) { .dpad { display: grid; } }

.db {
  background: rgba(99,102,241,0.12);
  border: 1px solid rgba(99,102,241,0.28);
  border-radius: 10px;
  color: #a5b4fc;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.08s;
}
.db:active { background: rgba(99,102,241,0.38); }
.db.empty { visibility: hidden; }
</style>
</head>
<body>
<div class="game-wrap">
  <canvas id="c"></canvas>
  <div class="dpad">
    <div class="db empty"></div><div class="db" data-d="up">↑</div><div class="db empty"></div>
    <div class="db" data-d="left">←</div><div class="db empty"></div><div class="db" data-d="right">→</div>
    <div class="db empty"></div><div class="db" data-d="down">↓</div><div class="db empty"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// PUBLISH OR PERISH — A Snake Game for Indie Publishers
// Grow your subscriber list. Publish content. Convert members.
// Don't let your audience churn.
// ═══════════════════════════════════════════════════════════

const COLS = 22, ROWS = 22;
const CELL = Math.floor(Math.min(window.innerWidth - 32, window.innerHeight - 140, 500) / COLS);
const W = COLS * CELL, H = ROWS * CELL;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

// ── Audio ──────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();

function tone(freq, type, dur, vol = 0.25, slideTo = null) {
  try {
    const g = AC.createGain(), o = AC.createOscillator();
    o.type = type; o.frequency.value = freq;
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, AC.currentTime + dur);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch(e) {}
}

const sfx = {
  eat(score) {
    const f = 200 + score * 10;
    tone(f, 'sine', 0.1, 0.22, f * 1.6);
    setTimeout(() => tone(f * 2, 'triangle', 0.07, 0.12), 55);
  },
  gold() {
    [0,80,160].forEach((t,i) => setTimeout(() => tone([440,550,660][i], 'triangle', 0.18, 0.18), t));
  },
  die() {
    tone(180, 'sawtooth', 0.06, 0.3, 60);
    setTimeout(() => tone(70, 'sine', 0.5, 0.22, 35), 90);
  },
  levelup() {
    [0,110,220,370].forEach((t,i) => setTimeout(() => tone([330,440,550,660][i], 'sine', 0.22, 0.2), t));
  },
  ghost() {
    tone(900, 'sine', 0.4, 0.28, 450);
    setTimeout(() => tone(1200, 'triangle', 0.2, 0.15, 600), 200);
  },
  combo(n) {
    tone(300 + n * 80, 'square', 0.08, 0.1);
  }
};

// ── Stars ──────────────────────────────────────────────────
const STARS = Array.from({length: 70}, () => ({
  x: Math.random() * W, y: Math.random() * H,
  r: Math.random() * 1.4 + 0.2,
  a: Math.random() * 0.5 + 0.05,
  phase: Math.random() * Math.PI * 2,
}));

// ── Publication stages (level themes) ─────────────────────
const STAGES = [
  { name: 'JUST PUBLISHED',  hHead: 160, hTail: 270, milestone: 'First 100 subscribers!' },
  { name: 'FINDING VOICE',   hHead: 90,  hTail: 200, milestone: 'Readers are sharing!' },
  { name: 'MONETIZING',      hHead: 30,  hTail: 330, milestone: 'Paid members incoming!' },
  { name: 'SCALING',         hHead: 280, hTail: 160, milestone: 'You\'re going full-time!' },
  { name: 'MEDIA EMPIRE',    hHead: 0,   hTail: 60,  milestone: 'You own your audience!' },
];

function getStage(level) {
  return STAGES[(level - 1) % STAGES.length];
}

function snakeHSL(i, len, level, alpha = 1) {
  const stage = getStage(level);
  const t = i / Math.max(len - 1, 1);
  let dh = ((stage.hTail - stage.hHead + 540) % 360) - 180;
  const h = (stage.hHead + dh * t + 360) % 360;
  const s = 100 - t * 15;
  const l = 68 - t * 22;
  return `hsla(${h},${s}%,${l}%,${alpha})`;
}

// ── Content types (food labels) ───────────────────────────
const CONTENT = [
  'New post live!', 'Newsletter sent!', 'Published!', 'Hit send!',
  'Thread dropped!', 'Essay shipped!', 'Story told!', 'Draft → live!',
];
const PAID_MSGS = [
  'Paid conversion!', 'New member!', 'Subscriber upgraded!', '$5/mo locked!',
];
const VIRAL_MSGS = [
  'Going viral!', 'HN front page!', 'Shared everywhere!', 'Inbox flooded!',
];
const CHURN_MSGS = [
  'Audience churned.', 'Subscribers lost.', 'They unsubscribed.',
  'Too much noise.', 'Lost your readers.', 'Open rate: 0%.',
];

function randFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ── State ──────────────────────────────────────────────────
let state, snake, prevSnake, dir, nextDir, foods, score, hiScore;
let tick, tickMs, level, combo, comboTimer, lastEatTime;
let ghostMode, ghostTimer, shakeAmt, particles;
let lerpT, lastTickTime, deathTimer, levelFlash, levelFlashTimer;
let floatingTexts, subscribers, deathMsg;

hiScore = parseInt(localStorage.getItem('pubHi1') || '0');

// ── Helpers ────────────────────────────────────────────────
function wrap(v, max) { return ((v % max) + max) % max; }
function lerp(a, b, t) { return a + (b - a) * t; }
function onSnake(x, y, skip = 0) { return snake.slice(skip).some(s => s.x === x && s.y === y); }
function onFood(x, y) { return foods.some(f => f.x === x && f.y === y); }
function mdist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }

function freeCell() {
  let p, tries = 0;
  do {
    p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    tries++;
  } while ((onSnake(p.x, p.y) || onFood(p.x, p.y)) && tries < 200);
  return p;
}

function makeFood(type) {
  return { ...freeCell(), type, age: 0, px: 0, py: 0, fleeing: false };
}

function ensureFoods() {
  const hasOrb = foods.some(f => f.type === 'orb' || f.type === 'flee');
  if (!hasOrb) foods.push(makeFood('orb'));
  if (level >= 2 && !foods.some(f => f.type === 'gold')) foods.push(makeFood('gold'));
}

// ── Floating text ─────────────────────────────────────────
function addFloat(wx, wy, text, color) {
  floatingTexts.push({
    x: wx * CELL + CELL / 2,
    y: wy * CELL,
    text, color, life: 1,
  });
}

// ── Particles ──────────────────────────────────────────────
function burst(wx, wy, color, count = 16, spd = 3.5, gravity = 0.06) {
  const cx = wx * CELL + CELL / 2;
  const cy = wy * CELL + CELL / 2;
  for (let i = 0; i < count; i++) {
    const a = (Math.PI * 2 * i / count) + Math.random() * 0.5;
    const s = spd * (0.4 + Math.random() * 0.9);
    particles.push({ x: cx, y: cy, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, color, r: 2.5 + Math.random() * 2.5, g: gravity });
  }
}

function deathBurst() {
  snake.forEach((seg, i) => {
    const stage = getStage(level);
    const t = i / snake.length;
    const h = (stage.hHead + (stage.hTail - stage.hHead) * t + 360) % 360;
    burst(seg.x, seg.y, `hsl(${h},100%,70%)`, 8, 5, 0.12);
  });
  shakeAmt = 20;
}

// ── Food AI ────────────────────────────────────────────────
function tickFleeFood(f) {
  if (tick % 3 !== 0) return;
  const head = snake[0];
  if (mdist(head, f) > 8) { f.fleeing = false; return; }
  f.fleeing = true;
  const moves = [{x:f.x+1,y:f.y},{x:f.x-1,y:f.y},{x:f.x,y:f.y+1},{x:f.x,y:f.y-1}]
    .map(p => ({x:wrap(p.x,COLS), y:wrap(p.y,ROWS)}))
    .filter(p => !onSnake(p.x,p.y) && !(onFood(p.x,p.y) && !(p.x===f.x&&p.y===f.y)))
    .sort((a, b) => mdist(b, head) - mdist(a, head));
  if (moves.length) { f.px = f.x; f.py = f.y; f.x = moves[0].x; f.y = moves[0].y; }
}

// ── Init ───────────────────────────────────────────────────
function init() {
  snake = [11,10,9,8,7].map(x => ({ x, y: 11, px: x, py: 11 }));
  prevSnake = snake.map(s => ({...s}));
  dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
  foods = []; score = 0; tick = 0; tickMs = 130;
  particles = []; shakeAmt = 0; level = 1;
  combo = 0; comboTimer = 0; lastEatTime = 0;
  ghostMode = false; ghostTimer = 0;
  lerpT = 0; lastTickTime = performance.now();
  deathTimer = 0; levelFlash = ''; levelFlashTimer = 0;
  floatingTexts = []; subscribers = 5; deathMsg = '';
  foods.push(makeFood('orb'));
}

// ── Update ─────────────────────────────────────────────────
function update(now) {
  tick++;

  // Combo decay
  if (comboTimer > 0) comboTimer--;
  else combo = 0;

  // Ghost decay
  if (ghostTimer > 0) { ghostTimer--; if (!ghostTimer) ghostMode = false; }

  // Food updates
  foods.forEach(f => {
    f.age++;
    if (f.type === 'flee') tickFleeFood(f);
  });

  // Upgrade an orb to flee occasionally (viral content!)
  if (tick % 45 === 0 && score >= 4 && !foods.some(f => f.type === 'flee')) {
    const orb = foods.find(f => f.type === 'orb');
    if (orb) orb.type = 'flee';
  }

  // Spawn open web power-up
  if (tick % 100 === 0 && score >= 6 && !foods.some(f => f.type === 'ghost')) {
    foods.push(makeFood('ghost'));
  }

  // Save prev positions for lerp
  prevSnake = snake.map(s => ({...s}));

  dir = nextDir;
  const nx = wrap(snake[0].x + dir.x, COLS);
  const ny = wrap(snake[0].y + dir.y, ROWS);

  // Self collision = churn
  if (!ghostMode && onSnake(nx, ny, 1)) {
    state = 'dead';
    deathTimer = 150;
    deathMsg = randFrom(CHURN_MSGS);
    if (score > hiScore) { hiScore = score; localStorage.setItem('pubHi1', hiScore); }
    deathBurst();
    sfx.die();
    return;
  }

  // Advance head
  snake.unshift({ x: nx, y: ny, px: snake[0].x, py: snake[0].y });

  // Food collision
  const fi = foods.findIndex(f => f.x === nx && f.y === ny);
  if (fi >= 0) {
    const food = foods[fi];
    foods.splice(fi, 1);

    // Combo
    const timeSinceLast = now - lastEatTime;
    combo = timeSinceLast < 3500 ? Math.min(combo + 1, 10) : 1;
    comboTimer = 200;
    lastEatTime = now;

    let pts = 1;
    if (food.type === 'gold') { pts = 3; addFloat(food.x, food.y, randFrom(PAID_MSGS), '#ffd700'); }
    else if (food.type === 'flee') { pts = 2; addFloat(food.x, food.y, randFrom(VIRAL_MSGS), '#ff6040'); }
    else if (food.type === 'ghost') { pts = 0; addFloat(food.x, food.y, 'Open Web mode!', '#c084fc'); }
    else { addFloat(food.x, food.y, randFrom(CONTENT), '#00ffcc'); }

    score += pts * combo;
    subscribers = snake.length;

    const colors = { orb: '#00ffcc', gold: '#ffd700', flee: '#ff6040', ghost: '#c084fc' };
    burst(food.x, food.y, colors[food.type] || '#00ffcc', food.type === 'gold' ? 26 : 16, food.type === 'gold' ? 5 : 3.5);

    if (food.type === 'ghost') { ghostMode = true; ghostTimer = 360; sfx.ghost(); }
    else if (food.type === 'gold') sfx.gold();
    else sfx.eat(score);

    if (combo >= 2) sfx.combo(combo);

    // Level up = new publication stage
    const newLevel = Math.floor(score / 12) + 1;
    if (newLevel > level) {
      level = newLevel;
      tickMs = Math.max(50, 130 - (level - 1) * 13);
      const stage = getStage(level);
      levelFlash = stage.milestone;
      levelFlashTimer = 120;
      sfx.levelup();
      shakeAmt = 8;
    }

    ensureFoods();
  } else {
    snake.pop();
  }

  // Floating text physics
  floatingTexts = floatingTexts.filter(ft => ft.life > 0.02);
  floatingTexts.forEach(ft => { ft.y -= 0.8; ft.life -= 0.018; });

  // Particles physics
  particles = particles.filter(p => p.life > 0.02);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.88; p.vy *= 0.88;
    p.vy += p.g;
    p.life -= 0.028;
  });

  if (shakeAmt > 0.3) shakeAmt *= 0.8;
}

// ── Draw helpers ───────────────────────────────────────────
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noglow() { ctx.shadowBlur = 0; }

function drawBg(t) {
  const stage = getStage(level);
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.9);
  g.addColorStop(0, `hsl(${230 + stage.hHead * 0.1},35%,7%)`);
  g.addColorStop(1, `hsl(${220 + stage.hHead * 0.05},45%,3%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(t) {
  STARS.forEach(s => {
    ctx.globalAlpha = s.a * (0.5 + 0.5 * Math.sin(t / 900 + s.phase));
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawGrid() {
  const stage = getStage(level);
  ctx.strokeStyle = `hsla(${220 + stage.hHead * 0.1},60%,60%,0.035)`;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, H); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(W, j*CELL); ctx.stroke();
  }
}

function drawSnake(t) {
  if (snake.length < 2) return;

  const pts = snake.map((seg, i) => {
    const prev = prevSnake[i] || prevSnake[prevSnake.length - 1];
    let dx = seg.x - prev.x, dy = seg.y - prev.y;
    if (Math.abs(dx) > COLS / 2) dx -= Math.sign(dx) * COLS;
    if (Math.abs(dy) > ROWS / 2) dy -= Math.sign(dy) * ROWS;
    return {
      x: (prev.x + dx * lerpT) * CELL + CELL / 2,
      y: (prev.y + dy * lerpT) * CELL + CELL / 2,
    };
  });

  const ghostAlpha = ghostMode ? 0.45 + 0.3 * Math.sin(t / 70) : 1;
  const len = pts.length;

  const passes = [
    { blur: 22, width: CELL * 0.82, a: 0.25 },
    { blur: 10, width: CELL * 0.60, a: 0.55 },
    { blur: 2,  width: CELL * 0.42, a: 1.00 },
  ];

  passes.forEach(pass => {
    ctx.save();
    ctx.globalAlpha = ghostAlpha * pass.a;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = pass.width;

    for (let i = 0; i < len - 1; i++) {
      const from = pts[i], to = pts[i + 1];
      const g = ctx.createLinearGradient(from.x, from.y, to.x, to.y);
      g.addColorStop(0, snakeHSL(i, len, level));
      g.addColorStop(1, snakeHSL(i + 1, len, level));
      ctx.shadowColor = snakeHSL(i, len, level);
      ctx.shadowBlur = pass.blur;
      ctx.strokeStyle = g;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    }
    ctx.restore();
  });

  // Head orb
  const head = pts[0];
  const headR = CELL * 0.48;
  const headColor = snakeHSL(0, len, level);

  ctx.save();
  ctx.globalAlpha = ghostAlpha;

  glow(headColor, 24); ctx.fillStyle = headColor;
  ctx.beginPath(); ctx.arc(head.x, head.y, headR, 0, Math.PI * 2); ctx.fill();

  noglow(); ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.arc(head.x - headR*0.22, head.y - headR*0.22, headR*0.32, 0, Math.PI*2); ctx.fill();

  // Eyes
  const eyeA = Math.atan2(dir.y, dir.x);
  const perpA = eyeA + Math.PI / 2;
  const eOff = CELL * 0.17;
  [-1, 1].forEach(side => {
    const ex = head.x + Math.cos(eyeA)*eOff + Math.cos(perpA)*side*eOff*0.75;
    const ey = head.y + Math.sin(eyeA)*eOff + Math.sin(perpA)*side*eOff*0.75;
    ctx.fillStyle = '#050510';
    ctx.beginPath(); ctx.arc(ex, ey, 3.8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(ex - 1.2, ey - 1.2, 1.5, 0, Math.PI*2); ctx.fill();
  });

  ctx.restore();
}

function drawFoods(t) {
  foods.forEach(f => {
    const cx = f.x * CELL + CELL / 2;
    const cy = f.y * CELL + CELL / 2;
    const pulse = Math.sin(t / 350 + f.age / 18) * 0.15;

    ctx.save();

    if (f.type === 'gold') {
      // Paid member — star with $ symbol
      const r = CELL * 0.37 * (1 + pulse);
      ctx.translate(cx, cy); ctx.rotate(t / 380);
      glow('#ffd700', 20); ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i * Math.PI / 5) - Math.PI / 2;
        const rr = i%2===0 ? r : r*0.42;
        i === 0 ? ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr) : ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
      }
      ctx.closePath(); ctx.fill();
      noglow(); ctx.fillStyle = '#080810';
      ctx.font = `bold ${CELL * 0.35}px 'Courier New'`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);

    } else if (f.type === 'ghost') {
      // Open Web / ActivityPub power-up
      const r = CELL * 0.39 * (1 + pulse * 0.5);
      glow('#c084fc', 22); ctx.fillStyle = '#c084fc';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      noglow(); ctx.font = `${CELL * 0.5}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🌐', cx, cy + 1);

    } else if (f.type === 'flee') {
      // Viral post — runs away from you
      const r = CELL * 0.35 * (1 + Math.sin(t/55) * 0.28);
      glow('#ff3010', 22); ctx.fillStyle = f.fleeing ? '#ff3a15' : '#ff5530';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      noglow(); ctx.font = `${CELL * 0.48}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🔥', cx, cy + 1);

    } else {
      // New content — level-colored envelope
      const stage = getStage(level);
      const r = CELL * 0.33 * (1 + pulse);
      glow(`hsl(${stage.hHead},100%,70%)`, 18); ctx.fillStyle = `hsl(${stage.hHead},85%,65%)`;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      noglow(); ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.beginPath(); ctx.arc(cx - r*0.28, cy - r*0.3, r*0.33, 0, Math.PI*2); ctx.fill();
    }

    noglow();
    ctx.restore();
  });
}

function drawFloatingTexts() {
  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.globalAlpha = ft.life;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = 'bold 11px Inter, sans-serif';
    ctx.fillStyle = ft.color;
    glow(ft.color, 8);
    ctx.fillText(ft.text, ft.x, ft.y);
    noglow();
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life * p.life;
    glow(p.color, 10); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1; noglow();
}

function drawHUD(t) {
  ctx.save();
  const stage = getStage(level);

  // Subscribers — top left
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.font = '10px "Courier New"'; ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText('SUBSCRIBERS', 10, 8);
  const sz = 20 + Math.min(combo * 1.5, 8);
  ctx.font = `bold ${sz}px 'Courier New'`;
  ctx.fillStyle = '#fff';
  glow(snakeHSL(0, 10, level), 14);
  ctx.fillText(String(score).padStart(4, '0'), 10, 22);

  // Stage + best — top right
  noglow();
  ctx.font = '10px "Courier New"'; ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.textAlign = 'right';
  ctx.fillText(stage.name, W - 10, 8);
  ctx.fillText('BEST ' + hiScore, W - 10, 22);

  // Publishing cadence bar — bottom
  const speedPct = 1 - (tickMs - 50) / 80;
  ctx.fillStyle = `hsla(${stage.hHead},100%,65%,0.15)`;
  ctx.fillRect(0, H - 4, W, 4);
  ctx.fillStyle = snakeHSL(0, 10, level);
  ctx.fillRect(0, H - 4, W * speedPct, 4);

  // Combo = publishing streak
  if (combo >= 2 && comboTimer > 0) {
    const a = Math.min(1, comboTimer / 40);
    const sc = 1 + Math.sin(t / 70) * 0.07;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W / 2, 22);
    ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${16 + Math.min(combo * 1.5, 10)}px 'Courier New'`;
    ctx.fillStyle = '#ffd700';
    glow('#ff8800', 16);
    ctx.fillText(`${combo}x STREAK!`, 0, 0);
    ctx.restore();
  }

  // Open Web mode timer
  if (ghostMode) {
    const secs = Math.ceil(ghostTimer / 60);
    const ga = 0.4 + 0.3 * Math.sin(t / 90);
    ctx.globalAlpha = ga;
    ctx.textAlign = 'center'; ctx.font = '11px "Courier New"';
    ctx.fillStyle = '#c084fc';
    glow('#c084fc', 10);
    ctx.fillText(`🌐 OPEN WEB MODE  ${secs}s`, W/2, H - 18);
  }

  // Stage milestone flash
  if (levelFlashTimer > 0) {
    levelFlashTimer--;
    const a = Math.min(1, levelFlashTimer / 30);
    const sc = 1 + Math.sin((120 - levelFlashTimer) / 10) * 0.08;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W/2, H/2);
    ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 22px Inter, sans-serif';
    ctx.fillStyle = '#fff';
    glow(snakeHSL(0, 10, level), 30);
    ctx.fillText(levelFlash, 0, 0);
    ctx.restore();
  }

  noglow();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawTitle(t) {
  drawBg(t); drawStars(t); drawGrid();
  const stage = getStage(1);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // Title
  const pulse = 28 + Math.sin(t / 600) * 10;
  glow(`hsl(${stage.hHead},100%,65%)`, pulse);
  ctx.font = 'bold 36px Inter, sans-serif';
  ctx.fillStyle = `hsl(${stage.hHead},100%,72%)`;
  ctx.fillText('PUBLISH', W/2, H/2 - 85);
  ctx.fillText('OR PERISH', W/2, H/2 - 45);
  noglow();

  ctx.font = '11px Inter, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.40)';
  ctx.fillText('A snake game for indie publishers', W/2, H/2 - 8);

  ctx.font = '11px "Courier New"'; ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillText('📧 PUBLISH  ·  ⭐ CONVERT  ·  🔥 GO VIRAL', W/2, H/2 + 18);
  ctx.fillText('🌐 OPEN WEB = INVULNERABLE', W/2, H/2 + 36);

  if (Math.floor(t / 580) % 2) {
    ctx.font = 'bold 13px "Courier New"'; ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('SPACE  /  TAP  TO  START', W/2, H/2 + 68);
  }

  if (hiScore > 0) {
    ctx.font = '11px "Courier New"'; ctx.fillStyle = 'rgba(255,215,0,0.45)';
    ctx.fillText('BEST  ' + hiScore + '  subscribers', W/2, H/2 + 96);
  }

  // Controls hint at bottom
  ctx.font = '10px "Courier New"'; ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillText('WASD  ·  ARROWS  ·  SWIPE', W/2, H - 20);
}

function drawDead(t) {
  ctx.fillStyle = 'rgba(5,5,15,0.65)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  glow('#ff2020', 22); ctx.font = 'bold 28px Inter, sans-serif'; ctx.fillStyle = '#ff4444';
  ctx.fillText(deathMsg || 'AUDIENCE CHURNED', W/2, H/2 - 56); noglow();

  ctx.font = '14px "Courier New"'; ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.fillText(score + '  subscribers', W/2, H/2 - 16);

  ctx.font = '11px "Courier New"'; ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText('Stage: ' + getStage(level).name, W/2, H/2 + 6);

  if (score > 0 && score >= hiScore) {
    glow('#ff8800', 14); ctx.font = 'bold 15px "Courier New"'; ctx.fillStyle = '#ffd700';
    ctx.fillText('★  NEW  RECORD  ★', W/2, H/2 + 32); noglow();
  }

  if (Math.floor(t / 580) % 2) {
    ctx.font = '12px "Courier New"'; ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText('SPACE  /  TAP  TO  PUBLISH  AGAIN', W/2, H/2 + 64);
  }
}

// ── Main loop ──────────────────────────────────────────────
let lastTick = 0;

function loop(now) {
  requestAnimationFrame(loop);

  ctx.save();
  if (shakeAmt > 0.4) {
    ctx.translate((Math.random()-0.5)*shakeAmt, (Math.random()-0.5)*shakeAmt);
    shakeAmt *= 0.80;
  }

  if (state === 'title') { drawTitle(now); ctx.restore(); return; }

  if (state === 'play' && now - lastTick >= tickMs) {
    lastTick = now; lastTickTime = now; lerpT = 0;
    update(now);
  }

  if (state === 'play') lerpT = Math.min((now - lastTickTime) / tickMs, 1);

  drawBg(now); drawStars(now); drawGrid();
  drawParticles(); drawFoods(now);

  if (state !== 'dead' || deathTimer > 80) drawSnake(now);

  drawFloatingTexts();
  drawHUD(now);

  if (state === 'dead') {
    deathTimer--;
    if (deathTimer < 80) drawDead(now);
    if (deathTimer <= 0) state = 'gameover';
  }

  if (state === 'gameover') drawDead(now);

  ctx.restore();
}

// ── Input ──────────────────────────────────────────────────
const KEY_DIR = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  KeyW:{x:0,y:-1},    KeyS:{x:0,y:1},      KeyA:{x:-1,y:0},      KeyD:{x:1,y:0},
};

function setDir(d) {
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
}

function startGame() {
  init(); state = 'play'; lastTick = performance.now();
}

document.addEventListener('keydown', e => {
  if (AC.state === 'suspended') AC.resume();
  if (e.code === 'Space') {
    if (state === 'title' || state === 'gameover' || state === 'dead') startGame();
    return;
  }
  if (state !== 'play') return;
  const d = KEY_DIR[e.code];
  if (d) { setDir(d); e.preventDefault(); }
});

let t0 = null;
canvas.addEventListener('touchstart', e => {
  AC.resume();
  t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (state === 'title' || state === 'gameover') startGame();
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (!t0 || state !== 'play') return;
  const dx = e.changedTouches[0].clientX - t0.x;
  const dy = e.changedTouches[0].clientY - t0.y;
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? {x:1,y:0} : {x:-1,y:0});
  else setDir(dy > 0 ? {x:0,y:1} : {x:0,y:-1});
  t0 = null; e.preventDefault();
}, { passive: false });

const DPAD_DIR = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
document.querySelectorAll('.db[data-d]').forEach(btn => {
  btn.addEventListener('touchstart', e => {
    AC.resume(); e.preventDefault();
    if (state === 'play') setDir(DPAD_DIR[btn.dataset.d]);
  }, { passive: false });
});

// ── Boot ───────────────────────────────────────────────────
state = 'title';
init();
requestAnimationFrame(loop);
</script>
<script src="nav.js"></script>
</body>
</html>
